services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: backseat
      POSTGRES_USER: backseat
      POSTGRES_PASSWORD: backseat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backseat -d backseat"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - backseat-postgres:/var/lib/postgresql/data

volumes:
  backseat-postgres:

